name: align

# 对齐检查：核对好的每一句文字（每个字、每个英文单词）对到录音的时间轴上（torchaudio MMS_FA），
# 找出对不上的字词、开头结尾漏写的话、标点处真实的停顿。结果在 research/新录音转录/核对结果/对齐检查/。
on:
  workflow_dispatch:
  push:
    branches: ["claude/**"]
    paths:
      - "research/新录音转录/align_check.py"
      - "research/新录音转录/核对结果/逐句定稿.json"
      - ".github/workflows/align.yml"

permissions:
  contents: write

concurrency:
  group: align-${{ github.ref }}
  cancel-in-progress: true

jobs:
  align:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      OUT: research/新录音转录/核对结果/对齐检查
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install (CPU)
        run: |
          python -m pip install -U pip
          python -m pip install torch==2.7.1 torchaudio==2.7.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install soundfile pypinyin numpy
      - name: Align
        run: |
          python research/新录音转录/align_check.py --list research/新录音转录/要转录.txt \
            --rows research/新录音转录/核对结果/逐句定稿.json --out "$OUT"
      - name: Commit results
        if: always()
        run: |
          [ -d "$OUT" ] || exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$OUT"
          git commit -m "记录：新录音对齐检查结果（GitHub 自动运行）" || exit 0
          for i in 1 2 3 4 5; do
            git pull --rebase origin ${GITHUB_REF_NAME} && git push origin HEAD:${GITHUB_REF_NAME} && break
            sleep $((i * 6))
          done
