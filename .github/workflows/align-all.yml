name: align-all

# 全部录音（以前的 15 个 + 新录的两段，1221 句）的最终文字：build_texts.py 把核对好的母本 / 定稿对到每个切片上，
# 再做对齐检查（每个字词对到录音时间轴上）。结果在 research/训练实测/（逐句文字.json + 对齐检查/）。
on:
  workflow_dispatch:
  push:
    branches: ["claude/**"]
    paths:
      - "research/训练实测/build_texts.py"
      - "research/训练实测/录音.txt"
      - "research/新录音转录/align_check.py"
      - "research/文字校正/老师的母本/母本_录音核对后.csv"
      - ".github/workflows/align-all.yml"

permissions:
  contents: write

concurrency:
  group: align-all-${{ github.ref }}
  cancel-in-progress: true

jobs:
  align:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      OUT: research/训练实测/对齐检查
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install (CPU)
        run: |
          python -m pip install -U pip
          python -m pip install torch==2.7.1 torchaudio==2.7.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install soundfile pypinyin numpy
      - name: Build per-clip texts
        run: python research/训练实测/build_texts.py
      - name: Align
        run: |
          python research/新录音转录/align_check.py --list research/训练实测/录音.txt \
            --rows research/训练实测/逐句文字.json --text-field 文字 --out "$OUT" --work /tmp/align
      - name: Commit results
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/训练实测/逐句文字.json "$OUT" 2>/dev/null || true
          git commit -m "记录：全部录音的最终文字和对齐检查（GitHub 自动运行）" || exit 0
          for i in 1 2 3 4 5; do
            git pull --rebase origin ${GITHUB_REF_NAME} && git push origin HEAD:${GITHUB_REF_NAME} && break
            sleep $((i * 6))
          done
