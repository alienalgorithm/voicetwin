name: tests

on:
  push:
    # 只改了记录（research 里的 .md）或者实测工作流自动提交的结果：不用重跑测试（也不会把正在跑的测试取消掉）。
    # research 里测试要读的数据（文字校正的母本、官方资料）不在这里面
    paths-ignore:
      - "research/**/*.md"
      - "research/gsv_v4_v5/*/结果/**"
  pull_request:

# 同一个分支又推送了新的提交：旧提交还没跑完的测试取消，GitHub 的机器留给最新的代码
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        # 老师的 V5 整合包是 Python 3.12；3.9 只是以前的 v2pro 整合包用的（新的 Ubuntu 也没有 3.9 了）
        python: ["3.11", "3.12"]
        gsv: [""]
        include:
          # 和官方 V5 整合包（GPT-SoVITS-v5-20261005）一样：Windows、Python 3.12、各个库的版本一样（gradio 4.44.1……）
          - os: windows-latest
            python: "3.12"
            gsv: v5
    name: test (${{ matrix.os }}, ${{ matrix.python }}${{ matrix.gsv && ', V5 整合包的版本' || '' }})
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        if: matrix.gsv == ''
        run: python -m pip install -e ".[dev]"
      - name: Install (和官方 V5 整合包一样的版本)
        if: matrix.gsv == 'v5'
        run: python -m pip install -c tests/constraints-gsv-v5.txt -e ".[dev,webui,sv]"
      - name: Test
        run: python -m pytest -q -rf --junitxml=junit.xml
      # 失败时把每个没通过的测试写成注释（annotation），不用下载日志也能看到是哪个测试、为什么
      - name: Report failed tests
        if: failure()
        shell: python
        run: |
          import sys
          import xml.etree.ElementTree as ET
          sys.stdout.reconfigure(encoding="utf-8", errors="replace")  # Windows 的控制台是 cp1252：中文会让这一步自己出错
          try:
              root = ET.parse("junit.xml").getroot()
          except Exception as exc:
              print(f"::error title=junit.xml::{exc}")
              raise SystemExit(0)
          for case in root.iter("testcase"):
              for bad in list(case.findall("failure")) + list(case.findall("error")):
                  name = f"{case.get('classname')}.{case.get('name')}"
                  text = ((bad.get("message") or "") + " | " + (bad.text or "")[-1500:]).replace("%", "%25")
                  text = text.replace("\r", "").replace("\n", "%0A")
                  print(f"::error title={name}::{text}")
