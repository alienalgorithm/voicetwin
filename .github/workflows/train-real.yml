name: train-real

# 由 research/训练实测/train_exp.py workflow 生成（改那里，再运行
#   python research/训练实测/train_exp.py workflow > .github/workflows/train-real.yml），不要直接改这个文件。
#
# 老师自己的录音（research/训练实测/录音.txt，约 2.5 小时，文字逐句核对过）在 GitHub 的处理器上真的训练 V5，
# 再用声音分身自己的打分实测比较不同的设置；实测最好的设置以后当程序的默认设置。
# 一台机器最多 6 小时，所以：准备素材 → 训练（一台接一台：快到时间就在存完一轮以后停下、打包，下一台接着练；
# 练完写 DONE.json，后面的跳过）→ 准备打分（下载声纹模型、整理参考录音库、校准，试生成一句）→ 第一轮打分（几台同时）→
# 第二轮（按第一轮的排名定：cfg_rate、补一个轮数）→ 汇总，提交到 research/训练实测/结果/。
# 每一步结束时把进度和日志提交到结果文件夹（边做边备份）。
on:
  workflow_dispatch:
    inputs:
      variant:
        description: "训练方式：default / app_cpu / lora16 / rank64（见 train_exp.py 的 VARIANTS）"
        default: default
  push:
    branches: ["claude/**"]
    paths:
      - "research/训练实测/train_exp.py"
      - "research/训练实测/ci.sh"
      - ".github/workflows/train-real.yml"

permissions:
  contents: write

# 一次要跑一两天：别的推送不能把它取消（新的一次排在后面）
concurrency:
  group: train-real-${{ github.ref }}
  cancel-in-progress: false

env:
  VARIANT: ${{ inputs.variant || 'default' }}
  OUT: ${{ (inputs.variant && inputs.variant != 'default') && format('research/训练实测/结果/{0}', inputs.variant) || 'research/训练实测/结果' }}
  EXP: research/训练实测/train_exp.py
  CI_SH: research/训练实测/ci.sh

jobs:
  prep:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - run: echo "T0=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: bash "$CI_SH" prep-env
      - run: python "$EXP" prep --variant "$VARIANT" --pack /mnt/w/pack/prep
      - uses: actions/upload-artifact@v4
        with:
          name: prep
          path: /mnt/w/pack/prep
          compression-level: 0
          retention-days: 5
          overwrite: true
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: log-prep
          path: /mnt/w/vt/exp/*.json
          retention-days: 10
          overwrite: true
          if-no-files-found: ignore
      - if: always()
        run: (python "$EXP" progress --variant "$VARIANT" --out "$OUT" --job prep && bash "$CI_SH" commit "记录：训练实测 prep（GitHub 自动运行）" "$OUT") || echo "::warning::进度没能提交"

  train-1:
    needs: prep
    runs-on: ubuntu-latest
    timeout-minutes: 355
    outputs:
      done: ${{ steps.train.outputs.done }}
    steps:
      - run: echo "T0=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: bash "$CI_SH" gsv-env train
      - uses: actions/download-artifact@v4
        with:
          name: prep
          path: /mnt/w/dl
      - id: train
        run: python "$EXP" train --variant "$VARIANT" --job train-1 --restore /mnt/w/dl --drop-restored --pack /mnt/w/pack --since "$T0" --budget-min 300
      - uses: actions/upload-artifact@v4
        if: steps.train.outputs.done == 'false'
        with:
          name: state-1
          path: /mnt/w/pack/state
          compression-level: 0
          retention-days: 4
          overwrite: true
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: steps.train.outputs.done == 'true'
